[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-turnstile-token"
version = "1.0.0"
description = "Cloudflare Turnstile token CLI via the Peak API - sitekey discovery, solve, and token output for CI and automation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Peak" }]
keywords = [
  "cloudflare", "turnstile", "cloudflare-turnstile", "turnstile-token",
  "token", "cli", "automation", "python", "peak",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
cf-turnstile-token = "cf_turnstile_token:main"

[project.urls]
Homepage = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cf-turnstile-token"
Documentation = "https://peak.fo/docs/turnstile?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cf-turnstile-token"
Pricing = "https://peak.fo/pricing?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cf-turnstile-token"
Source = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cf-turnstile-token"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
  "cf_turnstile_token.py",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "examples",
  "tests",
]
